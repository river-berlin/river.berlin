name = "hi-cards"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Required secrets (set via `npx wrangler secret put <NAME>`):
#   ADMIN_PASSWORD - required for writing entries
#   PHONE_NUMBER   - your phone number in international format (+49...); when set,
#                    valid card lookups include WhatsApp/Signal links.

# Create the KV namespace with:
#   npx wrangler kv namespace create CARDS
# then paste the generated id below
[[kv_namespaces]]
binding = "CARDS"
id = "08dff6a9f1234bb6b42a9f433160ad8a"
